<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Tool Genie</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f3ef;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box { max-width: 500px; }
    h1 { font-size: 72px; margin: 0 0 16px; font-weight: 800; }
    p { font-size: 16px; color: #6b6b6b; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      border-radius: 100px;
      font-weight: 700;
      font-size: 14px;
    }
    a:hover { background: #333; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Page not found. The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
